repos:
  # Keep this rev and the `ruff` pin in pyproject's dev group on the SAME
  # version. The hook builds its own isolated env, so if the two drift, the
  # pre-commit gate and `pixi run ruff` enforce different rule sets — which is
  # exactly what happened between 0.14 and 0.16 (default selection went from
  # 59 rules to 413). Bump both together.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/HunterMcGushion/docstr_coverage
    rev: v2.3.2
    hooks:
      - id: docstr-coverage
        # The pinned Python (.python-version): it parses src/ with its own,
        # and its manifest's `python3` would be whichever is on PATH.
        language_version: python3.14
        args: [--verbose, "0", --fail-under=100, src/]
  - repo: local
    hooks:
      - id: gen-catalog
        name: regenerate docs catalog + API reference
        entry: pixi run python docs/gen_catalog.py
        language: system
        pass_filenames: false
        files: ^(src/stargazer/(tasks|workflows|assets|bundles)/.*\.py|src/stargazer/bundles/.*\.yaml|src/stargazer/registry\.py|docs/gen_catalog\.py)$
      # Only a check: the docs workflow builds and publishes the site from main,
      # so the build's output and cache are removed, keeping the build's status.
      - id: zensical-build
        name: zensical build (docs compile check)
        entry: bash -c 'pixi run zensical build --clean; status=$?; rm -rf site .cache; exit $status'
        language: system
        pass_filenames: false
        files: ^(docs/.*\.md|src/.*\.py|zensical\.toml|pyproject\.toml)$
      # Runs on every commit, since a page's sources name code anywhere in the
      # repo and a move there breaks it as surely as an edit to the wiki.
      # Verbose so its stale-page warnings show on a commit that passes.
      - id: wiki-lint
        name: wiki lint (links, index, sources, stale pages)
        entry: pixi run python cli/wiki_lint.py
        language: system
        pass_filenames: false
        always_run: true
        verbose: true
      - id: mcp-server-import
        name: mcp server import check
        entry: pixi run python -c "from stargazer.server import mcp"
        language: system
        pass_filenames: false
        files: ^(src/stargazer/(server|registry|marshal)\.py|src/stargazer/assets/.*\.py|pyproject\.toml)$
      # A header the image build would refuse: its lock no longer matches it.
      # Locks in docker, as the build does (cli/lock_envs.py).
      - id: env-locks
        name: task environment locks match their headers
        entry: pixi run python cli/lock_envs.py --check
        language: system
        pass_filenames: false
        files: ^src/stargazer/(.+/)?env\.py(\.pixi\.lock)?$
      # The unit tier: a bare pytest run selects it (`addopts` in
      # pyproject.toml), in the dev environment.
      - id: unit-tests
        name: unit tests (pytest)
        entry: pixi run pytest -q
        language: system
        pass_filenames: false
        files: ^(src/|runtime/|cli/|tests/|pyproject\.toml$|pixi\.lock$)
