[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# `stargazer` is taken on PyPI; the import name is still `stargazer`.
name = "stargazer-bio"
# The release's date (`v2026.10.28` is version 2026.10.28; a second release
# that day is 2026.10.28.1). The release workflow refuses a tag that differs.
version = "2026.10.30"
description = "Bioinformatics workflow orchestration on Flyte v2, with assets identified by their IPFS CID"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.9.0",
    "aiofiles>=24.1.0",
    "flyte[tui]>=2.0.3",
    "loguru>=0.7.3",
    "pyyaml>=6.0.3",
    "psycopg[binary]>=3.2,<4",
    "boto3>=1.40,<2",
    "certifi>=2024.2.2",
]

[project.optional-dependencies]
# Bounded to the 2.x major: SDK 2.0 renamed the high-level server class
# (`FastMCP` → `MCPServer`, `mcp.server.fastmcp` → `mcp.server`), so an
# unbounded range silently resolves across a breaking rename.
mcp = ["mcp[cli]>=2.0,<3"]
docs = ["mkdocstrings[python]>=1.0.3"]

[project.scripts]
stargazer = "stargazer.server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"
# Each top-level directory under tests/ is in exactly one tier, and its tests
# carry that tier's marker (`TIERS` in tests/conftest.py). A bare run is the
# unit tier; a `-m` on the command line replaces this one to pick another
# (the write-tests skill). --strict-markers makes an unregistered marker,
# such as a typo in `TIERS`, an error.
addopts = ["--strict-markers", "-m", "unit"]
markers = [
    "unit: tests/{assets,notebooks,unit,utils}; this venv, on every commit (pre-commit)",
    "tasks: tests/tasks; each task's image, via cli/docker_task_tests.py",
    "devbox: tests/devbox; the local devbox, with -m devbox",
    "pinata: tests/pinata; the real Pinata API (uploads up to ~100 MB), with -m pinata",
    "postgres: tests/postgres; a throwaway Postgres container via Docker, with -m postgres",
    "dsql: tests/dsql; the real Aurora DSQL cluster as its admin, with -m dsql and infra's tenant.env",
]
filterwarnings = [
    # Ignore Pydantic deprecation warnings from flyte package (third-party)
    "ignore:Support for class-based `config` is deprecated:pydantic.warnings.PydanticDeprecatedSince20",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["stargazer*"]

[tool.setuptools.package-data]
stargazer = ["bundles/*.yaml", "notebooks/*.py", "tasks/*/env.py.pixi.lock"]

[dependency-groups]
dev = [
    # The unit tier imports the SDK's notebooks, and `marimo edit` from a
    # checkout. The notebook image pins the version notebooks run on
    # (runtime/Dockerfile).
    "marimo>=0.25.1,<0.26",
    "mkdocstrings[python]>=1.0.3",
    "pre-commit>=4.5.0",
    "pytest>=9.0.1",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=4.1.0",
    # Pinned to the same minor as .pre-commit-config.yaml's ruff rev — a
    # floating range let the lock drift to a ruff whose *default* rule set
    # differed from the pinned hook's. Bump both together.
    "ruff>=0.16.10,<0.17",
    "zensical>=0.0.24",
    { include-group = "runtime" },
]
# The notebook proxy's packages (`runtime/proxy.py`), which the image installs
# in the runtime venv beside its pinned marimo; the proxy never imports the
# package. In `dev` too, so the unit tier can test it.
runtime = [
    "flyte>=2.0.3",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "httpx>=0.27,<1",
    "websockets>=12",
    # Checks Union's signed login tokens (`_TokenGate`).
    "pyjwt[crypto]>=2.8,<3",
]
# cli/diagrams.sh's, in pixi's `diagrams` environment.
diagrams = [
    "pydeps>=3,<4",
    "pygraphviz>=2,<3",
]

# pixi reads this file as its manifest too, and pixi.lock locks it, written by
# the pixi version Flyte's image builder runs (`cli/lock_envs.py`), since that
# pixi refuses a newer one's lock. `pixi run` runs in the default
# environment: the core dependencies above, the `mcp` extra and the `dev`
# group, with the SDK editable from this checkout. pixi turns the extras and
# dependency groups into features of the same names. The notebook image
# installs `mcp`, its MCP server. A domain's environment is the header of its
# `env.py` instead (`task_image()` in config.py), and a notebook's own tasks'
# is the notebook's header (`notebook_image()`).
[tool.pixi.workspace]
channels = ["conda-forge"]
# A contributor's Mac beside Linux: CI, a devbox host, and the images, the
# notebook image for both of its architectures.
platforms = ["osx-arm64", "linux-64", "linux-aarch64"]

[tool.pixi.dependencies]
# requires-python alone lets pixi take the newest Python; .python-version's.
python = "3.14.*"

# The SDK from the manifest's own directory, editable.
[tool.pixi.feature.sdk.pypi-dependencies]
stargazer-bio = { path = ".", editable = true }

# One solve group, so every environment has the same versions.
[tool.pixi.environments]
default = { features = ["dev", "mcp", "sdk"], solve-group = "sdk" }
# cli/diagrams.sh's; pygraphviz's wheels bundle Graphviz.
diagrams = { features = ["dev", "mcp", "diagrams", "sdk"], solve-group = "sdk" }
mcp = { features = ["mcp", "sdk"], solve-group = "sdk" }

# Rule selection is ruff's default for the pinned version (see the ruff pin in
# [dependency-groups] and the matching rev in .pre-commit-config.yaml — bump
# them together), plus the banned-api rule that enforces the import layers.
# Only deliberate, reviewed exceptions are listed below.
[tool.ruff]
# Ruff's defaults for these, but pinned here so they resolve against the repo
# root. Left unset, each nested ruff.toml (the import layers) resolves them
# against its own directory: a cache in every layer, and first-party code
# looked for under it.
src = [".", "src"]
cache-dir = ".ruff_cache"

[tool.ruff.lint]
# The bans themselves live in nested ruff.toml files, one per layer; the rules
# are in src/stargazer/ruff.toml. Here the ban list is empty, so outside src/
# the rule does nothing.
extend-select = ["TID251"]
ignore = [
    # Graceful degradation is the app tier's design: a failed GitHub call, pod
    # probe, or teardown must never take a request down, so handlers catch
    # broadly and log. Narrowing these is actively harmful — a too-narrow
    # `except` in the proxy's cookie gate turned a clean 401 into a 500.
    "BLE001",
    # Implicit concatenation inside a collection is how multi-line shell
    # commands are written in `flyte.Image(...).with_commands([...])`.
    # Parenthesizing each would add noise to every image recipe.
    "ISC004",
    # try-except-pass. All sites reviewed and deliberate: best-effort pod
    # probes that fall back to GitHub, idempotent teardown of possibly-absent
    # apps, get-or-create existence probes and a readiness check.
    "S110",
]

[tool.ruff.lint.per-file-ignores]
# A marimo cell ends with a bare expression — that IS the render mechanism, not
# a useless statement. Applies to every notebook surface.
"src/stargazer/notebooks/**" = ["B018"]
# Streaming uploads hand a live file object to the HTTP client, so it outlives
# any `with` block and is closed by the client.
"src/stargazer/utils/pinata.py" = ["ASYNC230", "SIM115"]
# Task bodies are async for Flyte's benefit but do genuinely blocking local
# file I/O on the pod's own disk.
"src/stargazer/tasks/**" = ["ASYNC230"]

# Defaults for every pydeps run from the repo root, cli/diagrams.sh's included.
[tool.pydeps]
no_show = true
# Arrows point from importer to imported, as in the docs/architecture diagrams.
reverse = true
only = ["stargazer"]
# Drawing one module, pydeps stops at modules 2 imports away. 0 lifts the limit,
# so the diagram shows everything the module reaches.
max_bacon = 0
# `from stargazer.assets import Alignment` sends pydeps looking for a module
# named Alignment, and on a case-insensitive filesystem (macOS) it finds
# alignment.py and draws it twice. No module here is capitalized.
exclude = ["*.[A-Z]*"]
