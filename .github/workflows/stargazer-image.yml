# Publishes ghcr.io/stargazerbio/stargazer:latest, the image the README and
# Getting Started `docker run`, for both platforms. Only a change to the
# image's own files rebuilds it on a merge; SDK and notebook changes don't,
# and a maintainer republishes by hand (workflow_dispatch) to pick them up.
name: Stargazer image
on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - app/proxy.py
      - app/terminal_overlay.html
      - app/save_banner.html
      - app/launch-notebook.sh
      - app/notebook_agent.md
      - .github/workflows/stargazer-image.yml
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: stargazer-image
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/stargazerbio/stargazer:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
